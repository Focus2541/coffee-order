<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สั่งเครื่องดื่ม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script>
  /* ===== ตั้งค่า: แก้ 2 บรรทัดนี้ ===== */
  const LIFF_ID = '2011930869-xoZ90jal';
  const API_URL = 'https://script.google.com/macros/s/AKfycbwrf6PJOWHCYqVL8GZtdgrSy2y1vMalw3jejTyMa_swh_0MDYTaBu3QlIeA8VGVpxD_6A/exec';
  /* ================================= */
</script>
<style>
  :root { --bg: #E9ECE7; --card: #fff; --ink: #2A211D; --ink-2: #6A5F59; --line: #CBD2C8; --espresso: #3B2A24; --brew: #B86E12; --brew-bg: #FBEBD3; --danger: #B3261E; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans Thai', sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #4A7BD0; outline-offset: 2px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 18px 16px 120px; }
  .hello { color: var(--ink-2); font-size: 14px; margin: 0; }
  h1 { font-size: 24px; margin: 2px 0 4px; }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 6px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; position: sticky; top: 0; background: var(--bg); z-index: 2; scrollbar-width: none; }
  .tab { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 7px 14px; font-size: 14px; white-space: nowrap; color: var(--ink); }
  .tab.on { background: var(--espresso); border-color: var(--espresso); color: #fff; }
  h2 { font-size: 15px; color: var(--ink-2); font-weight: 600; margin: 18px 2px 8px; scroll-margin-top: 60px; }
  .item { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 8px; color: var(--ink); }
  .item .name { flex: 1; font-size: 16px; font-weight: 500; }
  .item .price { font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .item .plus { width: 34px; height: 34px; border-radius: 50%; background: var(--espresso); color: #fff; display: grid; place-items: center; font-size: 20px; line-height: 1; }
  .item .incart { background: var(--brew-bg); color: var(--brew); border-radius: 99px; font-size: 12px; font-weight: 600; padding: 2px 8px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
  .bar button { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 520px; margin: 0 auto; border: 0; border-radius: 14px; padding: 15px 18px; background: var(--espresso); color: #fff; font-size: 16px; font-weight: 600; }

  .scrim { position: fixed; inset: 0; background: rgba(30, 22, 18, .45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .scrim.open { display: flex; }
  .sheet { width: 100%; max-width: 520px; background: var(--card); border-radius: 20px 20px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 88vh; overflow: auto; }
  .sheet h3 { margin: 0 0 2px; font-size: 20px; }
  .sheet .p { color: var(--ink-2); margin: 0 0 16px; }
  .label { font-size: 14px; color: var(--ink-2); margin: 14px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 14px; font-size: 15px; color: var(--ink); }
  .chip[aria-pressed="true"] { border-color: var(--espresso); background: var(--espresso); color: #fff; }
  .stepper { display: inline-flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .stepper button { width: 40px; height: 40px; border: 0; border-radius: 9px; background: var(--bg); font-size: 20px; color: var(--ink); }
  .stepper b { min-width: 22px; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
  .primary { width: 100%; margin-top: 20px; border: 0; border-radius: 14px; padding: 15px; background: var(--espresso); color: #fff; font-size: 17px; font-weight: 600; }
  .primary:disabled { opacity: .55; cursor: progress; }
  .ghost { width: 100%; margin-top: 8px; border: 0; background: transparent; color: var(--ink-2); padding: 10px; font-size: 15px; }

  .line { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .line .n { flex: 1; }
  .line .n small { display: block; color: var(--brew); font-size: 13px; }
  .line .stepper button { width: 32px; height: 32px; font-size: 17px; }
  .total { display: flex; justify-content: space-between; font-size: 17px; font-weight: 600; margin-top: 14px; }
  .pay-note { background: var(--brew-bg); color: #6B3F07; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  .err { color: var(--danger); font-size: 14px; margin-top: 10px; min-height: 20px; }

  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #23744A; margin: 4px 0 2px; }
  .status::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .status.off { color: var(--danger); }
  .notice { background: var(--brew-bg); color: #6B3F07; border-radius: 14px; padding: 12px 14px; margin: 12px 0 4px; }
  .notice b { display: block; font-size: 12px; color: var(--brew); margin-bottom: 2px; }
  .place { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
  .place .t { flex: 1; }
  .place small { display: block; color: var(--ink-2); font-size: 12px; }
  .place a { border: 1px solid var(--espresso); color: var(--espresso); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .closed { background: #F6D9D6; color: #6E1712; border-radius: 14px; padding: 12px 14px; margin-top: 12px; font-weight: 600; }
  .bar button:disabled { background: #8F8580; cursor: default; }
  .timein { display: none; margin-top: 10px; }
  .timein.on { display: block; }
  .timein input { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 16px; font-family: inherit; }
  .center { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--ink-2); }
  .done { border-radius: 18px; padding: 20px; background: #DCF0E3; color: #14492E; margin-top: 18px; }
  .done.busy { background: var(--brew-bg); color: #6B3F07; }
  .done.storm { background: #F6D9D6; color: #6E1712; }
  .done .row { display: flex; gap: 22px; margin-top: 12px; }
  .done .k { font-size: 12px; opacity: .8; }
  .done .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .6; } } }
</style>
</head>
<body>
<div id="app"><div class="center">กำลังเปิดเมนู</div></div>

<div class="bar" id="bar" hidden><button type="button" id="cartBtn"><span id="cartCount"></span><span id="cartTotal"></span></button></div>

<div class="scrim" id="itemScrim" role="dialog" aria-modal="true" aria-labelledby="itemName">
  <div class="sheet">
    <h3 id="itemName"></h3>
    <p class="p" id="itemPrice"></p>
    <div class="label">ความหวาน</div>
    <div class="chips" id="sweetChips"></div>
    <div class="label">จำนวน</div>
    <div class="stepper"><button type="button" id="qMinus" aria-label="ลดจำนวน">−</button><b id="qVal">1</b><button type="button" id="qPlus" aria-label="เพิ่มจำนวน">+</button></div>
    <button class="primary" type="button" id="addBtn"></button>
    <button class="ghost" type="button" data-close>ปิด</button>
  </div>
</div>

<div class="scrim" id="cartScrim" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
  <div class="sheet">
    <h3 id="cartTitle">ตะกร้าของคุณ</h3>
    <div id="cartLines"></div>
    <div class="total"><span>ยอดรวม</span><span id="sumTotal"></span></div>
    <div class="label">จะมารับเมื่อไหร่</div>
    <div class="chips" id="pickChips"></div>
    <div class="timein" id="timeIn"><label>เลือกเวลา <input type="time" id="pickTime"></label></div>
    <div class="pay-note" id="payNote"></div>
    <div class="err" id="err" role="alert"></div>
    <button class="primary" type="button" id="submitBtn">ยืนยันสั่ง</button>
    <button class="ghost" type="button" data-close>เลือกเพิ่ม</button>
  </div>
</div>

<script>
  const SWEET = ['หวานปกติ', 'หวาน 50%', 'หวาน 25%', 'ไม่หวาน'];
  const DEMO = new URLSearchParams(location.search).has('demo');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const baht = (n) => '฿' + Number(n).toLocaleString('th-TH');
  let menu = [], shop = '', cart = [], pick = null, profileName = '', store = {}, skew = 0, pickup = 'asap';
  const MIN = 60000;
  const hm = (ms) => new Intl.DateTimeFormat('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Bangkok' }).format(new Date(ms));
  const nowMs = () => Date.now() + skew;

  function fail(msg) {
    $('app').innerHTML = '<div class="center"><div><p style="font-size:17px;color:var(--ink)">' + esc(msg) + '</p><p>ลองปิดหน้านี้แล้วเปิดใหม่จากไลน์ของร้าน</p></div></div>';
    $('bar').hidden = true;
  }

  async function api(body) {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
    return j.data;
  }

  async function start() {
    try {
      if (DEMO) {
        shop = 'ร้านกาแฟของฉัน'; profileName = 'คุณแพร';
        const t = Date.now();
        store = { accepting: true, reason: '', beforeOpen: false, open: '07:00', close: '17:00', earliestAt: t + 6 * MIN, closeAt: t + 300 * MIN, now: t,
          notice: 'วันนี้มีเมนูใหม่ โกโก้มินต์ 10 แก้วแรกลด 10 บาท', place: 'หน้าตลาดแม่แตง ฝั่งร้านขายยา', map: 'https://www.google.com/maps?q=18.9123,98.9456' };
        if (new URLSearchParams(location.search).has('closed')) Object.assign(store, { accepting: false, reason: 'วันนี้ปิดร้าน', notice: 'วันนี้ปิดร้าน 1 วัน ไปซ่อมรถ พรุ่งนี้เจอกันที่เดิมนะ' });
        menu = [['M01','อเมริกาโน่ร้อน','กาแฟร้อน',45],['M02','ลาเต้ร้อน','กาแฟร้อน',50],['M03','อเมริกาโน่เย็น','กาแฟเย็น',50],['M04','ลาเต้เย็น','กาแฟเย็น',55],['M06','มอคค่าเย็น','กาแฟเย็น',60],['M08','ชาไทยเย็น','ไม่ใช่กาแฟ',45],['M09','ชาเขียวเย็น','ไม่ใช่กาแฟ',55]].map(([id,name,cat,price]) => ({ id, name, cat, price }));
        return renderMenu();
      }
      if (LIFF_ID.indexOf('ใส่') === 0 || API_URL.indexOf('ใส่') === 0) return fail('ยังไม่ได้ใส่ LIFF ID และลิงก์เว็บแอปในไฟล์นี้');
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
      try { profileName = (await liff.getProfile()).displayName; } catch (e) {}
      const data = await (await fetch(API_URL + '?api=menu')).json();
      if (!data.ok) throw new Error(data.error);
      shop = data.data.shopName; menu = data.data.items; store = data.data.store; skew = store.now - Date.now();
      renderMenu();
    } catch (e) {
      fail('เปิดเมนูไม่ได้: ' + (e && e.message ? e.message : e));
    }
  }

  function renderMenu() {
    document.title = shop;
    const cats = [...new Set(menu.map((m) => m.cat))];
    const inCart = (id) => cart.filter((l) => l.id === id).reduce((s, l) => s + l.qty, 0);
    $('app').innerHTML = '<div class="wrap">' +
      (profileName ? '<p class="hello">สวัสดี ' + esc(profileName) + '</p>' : '') +
      '<h1>' + esc(shop) + '</h1>' + storeHead() +
      '<nav class="tabs" aria-label="หมวดเมนู">' + cats.map((c, i) => '<button class="tab' + (i ? '' : ' on') + '" type="button" data-cat="' + i + '">' + esc(c) + '</button>').join('') + '</nav>' +
      (menu.length ? cats.map((c, i) => '<h2 id="cat' + i + '">' + esc(c) + '</h2>' + menu.filter((m) => m.cat === c).map((m) => {
        const n = inCart(m.id);
        return '<button class="item" type="button" data-id="' + esc(m.id) + '"><span class="name">' + esc(m.name) + '</span>' +
          (n ? '<span class="incart">' + n + ' ในตะกร้า</span>' : '') +
          '<span class="price">' + baht(m.price) + '</span><span class="plus" aria-hidden="true">+</span></button>';
      }).join('')).join('') : '<p class="sub">วันนี้ยังไม่มีเมนูเปิดขาย</p>') + '</div>';
    renderBar();
  }

  function storeHead() {
    const st = store.accepting
      ? '<div class="status">' + (store.beforeOpen ? 'ยังไม่เปิด สั่งล่วงหน้าได้ เปิด ' + esc(store.open) + ' น.' : 'เปิดรับออเดอร์ถึง ' + esc(store.close) + ' น.') + '</div>' +
        '<p class="sub">สั่งล่วงหน้า เลือกเวลามารับ แล้วแวะมาหยิบได้เลย</p>'
      : '<div class="status off">' + esc(store.reason) + '</div>';
    return st +
      (store.notice ? '<div class="notice"><b>ประกาศ</b>' + esc(store.notice) + '</div>' : '') +
      (store.place || store.map ? '<div class="place"><div class="t"><small>วันนี้จอดที่</small>' + esc(store.place || 'ดูตำแหน่งในแผนที่') + '</div>' +
        (store.map ? '<a href="' + esc(store.map) + '" target="_blank" rel="noopener" data-map>แผนที่</a>' : '') + '</div>' : '') +
      (store.accepting ? '' : '<div class="closed">ตอนนี้ยังสั่งไม่ได้ ดูเมนูไว้ก่อนได้นะ</div>');
  }

  function renderBar() {
    const cups = cart.reduce((s, l) => s + l.qty, 0);
    const total = cart.reduce((s, l) => s + l.qty * l.price, 0);
    $('bar').hidden = !cups;
    $('cartCount').textContent = 'ดูตะกร้า · ' + cups + ' แก้ว';
    $('cartTotal').textContent = baht(total);
  }

  function open(id) { $(id).classList.add('open'); }
  function close(id) { $(id).classList.remove('open'); }
  document.querySelectorAll('.scrim').forEach((s) => {
    s.addEventListener('click', (e) => { if (e.target === s || e.target.hasAttribute('data-close')) close(s.id); });
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.scrim.open').forEach((s) => close(s.id)); });

  $('app').addEventListener('click', (e) => {
    const map = e.target.closest('a[data-map]');
    if (map && !DEMO && window.liff && liff.isInClient()) { e.preventDefault(); liff.openWindow({ url: map.href, external: true }); return; }
    const tab = e.target.closest('.tab');
    if (tab) {
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t === tab));
      $('cat' + tab.dataset.cat).scrollIntoView({ behavior: 'smooth' });
      return;
    }
    const item = e.target.closest('.item');
    if (!item) return;
    const m = menu.find((x) => x.id === item.dataset.id);
    pick = { m, sweet: SWEET[0], qty: 1 };
    $('itemName').textContent = m.name;
    $('itemPrice').textContent = baht(m.price) + ' ต่อแก้ว';
    renderPick();
    open('itemScrim');
  });

  function renderPick() {
    $('sweetChips').innerHTML = SWEET.map((s) => '<button class="chip" type="button" aria-pressed="' + (s === pick.sweet) + '">' + s + '</button>').join('');
    $('qVal').textContent = pick.qty;
    $('addBtn').disabled = !store.accepting;
    $('addBtn').textContent = store.accepting ? 'ใส่ตะกร้า · ' + baht(pick.qty * pick.m.price) : store.reason;
  }
  $('sweetChips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) { pick.sweet = c.textContent; renderPick(); } });
  $('qMinus').onclick = () => { pick.qty = Math.max(1, pick.qty - 1); renderPick(); };
  $('qPlus').onclick = () => { pick.qty = Math.min(20, pick.qty + 1); renderPick(); };
  $('addBtn').onclick = () => {
    const opt = pick.sweet;
    const found = cart.find((l) => l.id === pick.m.id && l.opt === opt);
    if (found) found.qty = Math.min(20, found.qty + pick.qty);
    else cart.push({ id: pick.m.id, name: pick.m.name, price: pick.m.price, opt, qty: pick.qty });
    close('itemScrim');
    renderMenu();
  };

  function renderCart() {
    $('cartLines').innerHTML = cart.map((l, i) =>
      '<div class="line"><span class="n">' + esc(l.name) + '<small>' + esc(l.opt) + '</small></span>' +
      '<span class="stepper"><button type="button" data-i="' + i + '" data-d="-1" aria-label="ลด">−</button><b>' + l.qty + '</b>' +
      '<button type="button" data-i="' + i + '" data-d="1" aria-label="เพิ่ม">+</button></span></div>').join('');
    $('sumTotal').textContent = baht(cart.reduce((s, l) => s + l.qty * l.price, 0));
    $('submitBtn').disabled = false;
    $('submitBtn').textContent = 'ยืนยันสั่ง';
    renderPickup();
  }

  function pickOptions() {
    const cups = cart.reduce((s, l) => s + l.qty, 0);
    const earliest = Math.max(store.earliestAt, nowMs() + MIN) + Math.max(0, cups - 1) * 2 * MIN;
    const round5 = (ms) => Math.ceil(ms / (5 * MIN)) * 5 * MIN;
    const opts = [{ v: 'asap', label: 'เร็วที่สุด ~' + hm(earliest) }];
    [15, 30, 60].forEach((n) => {
      const t = round5(Math.max(earliest, nowMs() + n * MIN));
      if (t <= store.closeAt && t > earliest + 4 * MIN) opts.push({ v: hm(t), label: hm(t) + ' (' + (n < 60 ? 'อีก ' + n + ' นาที' : 'อีก 1 ชม.') + ')' });
    });
    opts.push({ v: 'custom', label: 'เลือกเวลาเอง' });
    return { opts, earliest };
  }
  function renderPickup() {
    const { opts, earliest } = pickOptions();
    if (pickup !== 'asap' && pickup !== 'custom' && !opts.some((o) => o.v === pickup)) pickup = 'asap';
    $('pickChips').innerHTML = opts.map((o) => '<button class="chip" type="button" data-v="' + o.v + '" aria-pressed="' + (o.v === pickup) + '">' + o.label + '</button>').join('');
    $('timeIn').classList.toggle('on', pickup === 'custom');
    $('pickTime').min = hm(earliest);
    $('pickTime').max = store.close;
    if (!$('pickTime').value) $('pickTime').value = hm(earliest);
    $('payNote').textContent = 'มารับที่ ' + (store.place || 'รถกาแฟ') + ' · ระบบจะแจ้งเลขคิวในแชท และแจ้งอีกครั้งเมื่อเครื่องดื่มพร้อม';
  }
  $('pickChips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) { pickup = c.dataset.v; renderPickup(); } });
  $('cartBtn').onclick = () => { $('err').textContent = ''; renderCart(); open('cartScrim'); };
  $('cartLines').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    const l = cart[+b.dataset.i];
    l.qty = Math.min(20, l.qty + +b.dataset.d);
    if (l.qty <= 0) cart.splice(+b.dataset.i, 1);
    if (!cart.length) { close('cartScrim'); renderMenu(); return; }
    renderCart(); renderBar();
  });

  $('submitBtn').onclick = async () => {
    if (!cart.length) { $('err').textContent = 'ตะกร้ายังว่าง เลือกเครื่องดื่มก่อน'; return; }
    if (!store.accepting) { $('err').textContent = store.reason; return; }
    let pk = pickup;
    if (pickup === 'custom') {
      pk = $('pickTime').value;
      if (!pk) { $('err').textContent = 'เลือกเวลาที่จะมารับก่อน'; return; }
      if (pk > store.close) { $('err').textContent = 'ร้านรับออเดอร์ถึง ' + store.close + ' น.'; return; }
    }
    $('submitBtn').disabled = true;
    $('submitBtn').textContent = 'กำลังส่งออเดอร์';
    $('err').textContent = '';
    try {
      const payload = cart.map((l) => ({ id: l.id, qty: l.qty, opt: l.opt }));
      const r = DEMO
        ? { orderId: '20261008-036', queue: 'A-036', pickup: pk === 'asap' || pk === 'custom' ? hm(pickOptions().earliest) : pk, adjusted: false, ordersAhead: 1, total: cart.reduce((s, l) => s + l.qty * l.price, 0), level: 'busy', place: store.place, map: store.map }
        : await api({ action: 'order', idToken: liff.getIDToken(), cart: payload, pickup: pk });
      close('cartScrim');
      showDone(r);
      if (!DEMO && liff.isInClient()) {
        try { await liff.sendMessages([{ type: 'text', text: 'สั่งแล้ว #' + r.orderId }]); } catch (e) {}
        setTimeout(() => liff.closeWindow(), 1800);
      }
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      $('err').textContent = 'สั่งไม่สำเร็จ: ' + msg;
      $('submitBtn').disabled = false;
      $('submitBtn').textContent = 'ลองอีกครั้ง';
      if (!DEMO && msg.indexOf('หมดอายุ') >= 0) { liff.logout(); liff.login({ redirectUri: location.href }); }
    }
  };

  function showDone(r) {
    const head = { clear: 'ช่วงเวลานี้คิวโล่ง ได้ตามนัดแน่นอน', busy: 'ช่วงเวลานี้คนเยอะปานกลาง', storm: 'ช่วงเวลานี้คิวแน่น อาจช้ากว่านัดเล็กน้อย' }[r.level] || 'รับออเดอร์แล้ว';
    cart = [];
    $('bar').hidden = true;
    $('app').innerHTML = '<div class="wrap"><h1>' + esc(shop) + '</h1>' +
      '<div class="done ' + esc(r.level) + '" role="status"><div style="font-weight:600">' + head + '</div>' +
      '<div class="row"><div><div class="k">คิวของคุณ</div><div class="v">' + esc(r.queue) + '</div></div>' +
      '<div><div class="k">พร้อมรับ</div><div class="v">' + esc(r.pickup) + '</div></div>' +
      '<div><div class="k">ก่อนหน้า</div><div class="v">' + r.ordersAhead + ' คิว</div></div></div>' +
      '<p style="margin:12px 0 0;font-size:14px">ยอด ' + baht(r.total) + ' · ระบบส่งรายละเอียดเข้าแชทให้แล้ว</p>' +
      (r.adjusted ? '<p style="margin:8px 0 0;font-size:14px">เวลาที่เลือกเร็วกว่าที่ทำทัน ร้านเลื่อนให้เป็น ' + esc(r.pickup) + ' น.</p>' : '') + '</div>' +
      (r.place || r.map ? '<div class="place"><div class="t"><small>มารับที่</small>' + esc(r.place || 'ดูตำแหน่งในแผนที่') + '</div>' +
        (r.map ? '<a href="' + esc(r.map) + '" target="_blank" rel="noopener" data-map>แผนที่</a>' : '') + '</div>' : '') +
      '<button class="ghost" type="button" onclick="location.reload()">สั่งเพิ่ม</button></div>';
  }

  start();
</script>
</body>
</html>
